# ==============================================================================
# GitLab CI/CD Pipeline — @minedec/shared (c2-sso/microservicios/shared)
# Ejecutado en GitLab Runner institucional:
#   gitlab-runner@gitlab-servinformacion.iam.gserviceaccount.com (sin llaves JSON)
# Publica el paquete versionado @minedec/shared en GitLab NPM Package Registry
# ==============================================================================

stages:
  - quality
  - test
  - publish

default:
  image: node:22-alpine

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .npm/

lint_and_sast:
  stage: quality
  script:
    - npm ci
    - npm run lint
    - npm audit --audit-level=high
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

unit_tests_coverage:
  stage: test
  needs: ["lint_and_sast"]
  script:
    - npm ci
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 7 days

publish_npm_registry:
  stage: publish
  needs: ["lint_and_sast", "unit_tests_coverage"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|qa|develop|spec\/.*)$/'
  script:
    - npm ci
    - npm run build
    - echo "@minedec:registry=https://git.sitimapa.co/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "//git.sitimapa.co/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish --registry "https://git.sitimapa.co/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
