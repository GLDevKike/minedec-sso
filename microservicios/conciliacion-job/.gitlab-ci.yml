# ==============================================================================
# GitLab CI/CD Pipeline — @minedec/conciliacion-job (Subcomponente C2.2)
# Runner institucional: gitlab-runner@gitlab-servinformacion.iam.gserviceaccount.com
# Autenticación GCP: Metadata Server (Cero llaves JSON estáticas)
# ==============================================================================

stages:
  - lint-and-audit
  - test
  - build-and-push

variables:
  DOCKER_DRIVER: overlay2
  GCP_REGION: "us-east1"
  ARTIFACT_REGISTRY_REPO: "sso-containers"
  SERVICE_NAME: "conciliacion-job"
  CLOUD_RUN_JOB_NAME: "sso-conciliacion-job"
  RUNTIME_SERVICE_ACCOUNT: "sa-sso-sync-job"

lint_and_sast:
  stage: lint-and-audit
  image: node:22-alpine
  script:
    - npm ci
    - npm run lint
    - npm audit --omit=dev --audit-level=high

unit_and_integration_tests:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm run build
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 7 days

build_and_push_image:
  stage: build-and-push
  image: google/cloud-sdk:alpine
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|qa|develop|release\/.*)$/'
    - if: '$CI_COMMIT_BRANCH =~ /^spec\//'
      when: manual
      allow_failure: true
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        TARGET_PROJECT_ID="mec-003-sso-pro"
      elif [ "$CI_COMMIT_BRANCH" = "qa" ] || [[ "$CI_COMMIT_BRANCH" =~ ^release/.* ]]; then
        TARGET_PROJECT_ID="mec-003-sso-pre"
      else
        TARGET_PROJECT_ID="mec-003-sso-des"
      fi
      IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${TARGET_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${SERVICE_NAME}:${CI_COMMIT_SHA}"
      gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      docker build \
        --build-arg CI_JOB_TOKEN="${CI_JOB_TOKEN}" \
        --build-arg MINEDEC_SHARED_PROJECT_ID="${MINEDEC_SHARED_PROJECT_ID}" \
        -t "${IMAGE_URI}" .
      docker push "${IMAGE_URI}"
