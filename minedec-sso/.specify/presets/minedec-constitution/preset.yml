schema_version: "1.0"

preset:
  id: "minedec-constitution"
  name: "MINEDEC Constitution"
  version: "1.3.1"
  description: "Constitucion MINEDEC: stack por proyecto, SSO, SA/Secret Manager, seguridad de aplicacion XIV"
  author: "Glocation"
  repository: "https://github.com/GLocation-SAS/spec-kit-preset-glocation"
  license: "Proprietary"

requires:
  speckit_version: ">=0.13.0"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Constitucion MINEDEC con principios compartidos, stack por proyecto y gobernanza OKF/SSO"
      replaces: "constitution-template"

    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Spec en espanol con IDs FR/SC/User Story, OKF y SSO; sin stack"
      replaces: "spec-template"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Plantilla de plan en espanol con Technical Context Language/Version al estilo Spec Kit"
      replaces: "plan-template"

    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Preambulo MINEDEC (espanol, OKF, SSO) alrededor del comando specify de Spec Kit"
      strategy: "wrap"

tags:
  - "minedec"
  - "gcp"
  - "constitution"
  - "spanish"
