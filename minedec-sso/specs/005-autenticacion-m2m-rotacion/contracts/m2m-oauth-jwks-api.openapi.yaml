openapi: 3.1.0
info:
  title: Conecta MINEDEC C2.2 — API de Autenticación M2M (Client Credentials), Rotación Dual y Catálogo JWKS (`motor-pdp`)
  version: 1.0.0
  description: >
    Contrato OpenAPI 3.1 para la emisión de tokens OAuth 2.0 `Client Credentials` (`POST /api/v1/oauth/token`),
    publicación del catálogo criptográfico JWKS `RS256` segregado (`GET /api/v1/.well-known/jwks.json`)
    y administración interna del ciclo de vida de credenciales M2M y llaves JWKS (`<= 90 días` con ventana de gracia dual
    y revocación de emergencia `< 1 h` / `<= 300 s`).
servers:
  - url: https://pdp.sso.educacion.gob.ec
    description: Endpoint interno en Shared VPC (Internal Load Balancer GKE Autopilot)

paths:
  /api/v1/oauth/token:
    post:
      summary: Emisión de Access Token OAuth 2.0 Client Credentials (M2M)
      operationId: issueM2mAccessToken
      tags:
        - OAuth2 M2M
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        '200':
          description: Token JWT RS256 emitido exitosamente
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Pragma:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: grant_type o scope no soportado
        '401':
          description: Credencial M2M inválida, expirada o revocada

  /api/v1/.well-known/jwks.json:
    get:
      summary: Catálogo público JWKS RS256 exclusivo de MOTOR_PDP
      operationId: getPdpJwks
      tags:
        - JWKS
      responses:
        '200':
          description: Conjunto de llaves públicas JWK en estado ACTIVA_FIRMA y GRACIA_VERIFICACION
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'

  /internal/v1/pdp/m2m/credentials:
    post:
      summary: Aprovisionar nueva credencial M2M con secreto CSPRNG devuelto por única vez
      operationId: provisionM2mCredential
      tags:
        - Administración Interna M2M
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionM2mCredentialRequest'
      responses:
        '201':
          description: Credencial M2M creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionM2mCredentialResponse'
        '400':
          description: Violación de invariante de alcance por patrón o esquema inválido

  /internal/v1/pdp/m2m/credentials/{clientId}/rotate:
    post:
      summary: Rotar secreto de credencial M2M activando ventana de gracia dual (EN_ROTACION_GRACIA)
      operationId: rotateM2mCredentialSecret
      tags:
        - Administración Interna M2M
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateM2mCredentialRequest'
      responses:
        '200':
          description: Secreto rotado con ventana de gracia dual activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateM2mCredentialResponse'
        '400':
          description: Credencial no encontrada o revocada

  /internal/v1/pdp/m2m/credentials/{clientId}/expire-grace:
    post:
      summary: Cerrar ventana de gracia de credencial M2M purgando el secreto anterior
      operationId: expireM2mCredentialGrace
      tags:
        - Administración Interna M2M
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ventana de gracia cerrada; credencial en estado ACTIVA

  /internal/v1/pdp/m2m/credentials/{clientId}/revoke:
    post:
      summary: Revocar de emergencia una credencial M2M e invalidar tokens en vuelo (<= 300 s)
      operationId: revokeM2mCredentialEmergency
      tags:
        - Administración Interna M2M
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credencial revocada e invalidada en caché L2 Redis

  /internal/v1/pdp/jwks/rotate:
    post:
      summary: Rotar llave de firma RS256 de MOTOR_PDP (ACTIVA_FIRMA -> GRACIA_VERIFICACION)
      operationId: rotatePdpJwksKey
      tags:
        - Administración Interna JWKS
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kid:
                  type: string
                secret_manager_version:
                  type: string
      responses:
        '200':
          description: Llave rotada exitosamente

  /internal/v1/pdp/jwks/{kid}/retire:
    post:
      summary: Retirar limpiamente una llave JWKS en estado GRACIA_VERIFICACION (hacia RETIRADA)
      operationId: retirePdpJwksKey
      tags:
        - Administración Interna JWKS
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Llave retirada limpiamente del JWKS público

  /internal/v1/pdp/jwks/{kid}/revoke:
    post:
      summary: Revocar de emergencia una llave JWKS comprometida (< 1 h)
      operationId: revokePdpJwksKeyEmergency
      tags:
        - Administración Interna JWKS
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Llave revocada de emergencia

components:
  schemas:
    OAuthTokenRequest:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
        client_secret:
          type: string
        scope:
          type: string
          default: pdp:evaluate

    OAuthTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - scope
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          example: 3600
        scope:
          type: string
          example: pdp:evaluate

    JwksResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, use, alg, kid, n, e]
            properties:
              kty:
                type: string
                enum: [RSA]
              use:
                type: string
                enum: [sig]
              alg:
                type: string
                enum: [RS256]
              kid:
                type: string
              n:
                type: string
              e:
                type: string

    ProvisionM2mCredentialRequest:
      type: object
      required:
        - client_id
        - tipo_cliente
      properties:
        client_id:
          type: string
        tipo_cliente:
          type: string
          enum: [APLICACION_PATRON_1, PEP_PATRON_2]
        aplicacion_id:
          type: [string, 'null']
          format: uuid
        scopes_permitidos:
          type: string
          default: pdp:evaluate
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 90
          default: 90

    ProvisionM2mCredentialResponse:
      type: object
      required:
        - credencial_id
        - client_id
        - tipo_cliente
        - aplicacion_id
        - estado_credencial
        - expira_rotacion_en
        - client_secret_unica_vez
      properties:
        credencial_id:
          type: string
          format: uuid
        client_id:
          type: string
        tipo_cliente:
          type: string
          enum: [APLICACION_PATRON_1, PEP_PATRON_2]
        aplicacion_id:
          type: [string, 'null']
        estado_credencial:
          type: string
          enum: [ACTIVA]
        expira_rotacion_en:
          type: string
          format: date-time
        client_secret_unica_vez:
          type: string

    RotateM2mCredentialRequest:
      type: object
      properties:
        grace_window_seconds:
          type: integer
          minimum: 60
          maximum: 604800
          default: 86400
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 90
          default: 90

    RotateM2mCredentialResponse:
      type: object
      required:
        - client_id
        - estado_credencial
        - gracia_hasta
        - expira_rotacion_en
        - client_secret_unica_vez
      properties:
        client_id:
          type: string
        estado_credencial:
          type: string
          enum: [EN_ROTACION_GRACIA]
        gracia_hasta:
          type: string
          format: date-time
        expira_rotacion_en:
          type: string
          format: date-time
        client_secret_unica_vez:
          type: string
